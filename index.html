<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grand Réseau 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Diorama 3D plein écran ; interface réduite à des icônes posées sur des pastilles sombres */
:root{
  --ink:#0f1624; --chip:rgba(15,22,36,.82); --chip-2:#1c2740; --line:rgba(255,255,255,.12); --text:#f2f5fa; --muted:#9aa6c2;
  --yellow:#f5cf4f; --blue:#2f6fd6; --ok:#45c08a; --warn:#f2a33a; --bad:#ee5a5a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
svg{display:block}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.25)}

#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;flex-wrap:wrap;z-index:5;max-width:calc(100% - 20px)}
.stat{display:flex;align-items:center;gap:7px;padding:7px 11px;font:700 19px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{font:600 12px var(--body);margin-left:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mid{color:var(--warn)}

#ctrl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;z-index:5}
.grp{display:flex;padding:3px;gap:2px}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;position:relative;color:var(--text)}
.ib:hover{background:var(--chip-2)}
.ib.on{background:var(--yellow);color:#1a1a1a}
.ib.on2{background:var(--blue)}
.ib b{position:absolute;right:3px;bottom:2px;font:700 10px var(--display)}

#obj{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;padding:7px 12px;min-width:240px;max-width:calc(100% - 20px);cursor:pointer}
#obj .t{font:700 15px/1.1 var(--display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#obj .rw{font:700 13px var(--display);color:var(--yellow);white-space:nowrap}
#obj .bar{flex:1;min-width:50px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}

#dock{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:3px;padding:5px;max-width:calc(100% - 20px);overflow-x:auto}
.tool{width:56px;height:60px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;flex:0 0 auto;border:1px solid transparent}
.tool:hover{background:var(--chip-2)}
.tool.on{background:var(--chip-2);border-color:var(--yellow)}
.tool .p{font:700 12px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.tool.on .p{color:var(--yellow)}
.tool.locked{opacity:.4}
.tool .lk{position:absolute;top:4px;right:6px}
.tool kbd{position:absolute;top:3px;left:6px;font:700 10px var(--display);color:var(--muted)}
.dsep{width:1px;background:var(--line);margin:8px 3px;flex:0 0 auto}

#card{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:232px;z-index:5;padding:12px}
#card h3{margin:0 26px 8px 0;font:700 20px/1.1 var(--display);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
#card .x{position:absolute;top:8px;right:8px;width:26px;height:26px}
.row{display:flex;align-items:center;gap:9px;padding:4px 0;font-weight:600;font-variant-numeric:tabular-nums}
.row svg{flex:0 0 auto;opacity:.85}
.row .bar{flex:1}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ab{height:36px;padding:0 10px;border-radius:9px;background:var(--chip-2);border:1px solid var(--line);display:flex;align-items:center;gap:6px;font:700 14px var(--display);font-variant-numeric:tabular-nums}
.ab:hover{border-color:rgba(255,255,255,.3)}
.ab.y{background:var(--yellow);color:#1a1a1a;border-color:var(--yellow)}
.ab.r{background:#3d1c22;border-color:#7a2f36;color:#ffc9cd}
.ab:disabled{opacity:.45;cursor:not-allowed}
.range{width:100%;accent-color:var(--yellow)}

#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;border-radius:6px;background:rgba(15,22,36,.78);font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;will-change:transform}
.lbl i{width:7px;height:7px;border-radius:50%;display:block}
.lbl.sm{font-size:11px}

#tip{position:fixed;z-index:8;pointer-events:none;padding:5px 9px;font:700 14px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;gap:8px;align-items:center}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;align-items:center;gap:5px;z-index:6;pointer-events:none;width:min(420px,calc(100% - 20px))}
.toast{pointer-events:auto;padding:7px 13px;border-radius:999px;font:600 13.5px var(--body);border-left:4px solid var(--blue);animation:tin .25s ease-out;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}.toast.gold{border-left-color:var(--yellow)}
.toast.click{cursor:pointer}
.toast.out{opacity:0;transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(15,22,36,.35),rgba(6,10,20,.8));padding:16px}
.mc{width:min(460px,100%);text-align:center;padding:28px 24px}
.mc h1{margin:0;font:700 54px/0.95 var(--display);letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
.mc .sub{margin:6px 0 22px;color:var(--muted);font:600 15px var(--body)}
.picto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.picto div{display:flex;flex-direction:column;align-items:center;gap:7px;font:600 12.5px/1.25 var(--body);color:var(--muted)}
.picto svg{color:var(--text)}
.mbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mbtn .ab{height:44px;padding:0 22px;font-size:17px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;margin:0 auto 22px;max-width:300px;font-weight:600}
.keys kbd{font:700 12px var(--body);border:1px solid var(--line);border-radius:5px;padding:2px 7px;background:var(--ink);justify-self:end;white-space:nowrap}
.signs{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.signs span{font:700 13px var(--display);letter-spacing:.06em;padding:3px 9px;border-radius:4px;color:#fff}
.mc a{color:var(--muted);font-size:12.5px}
@media (max-width:960px){
  #ctrl{top:calc(60px + env(safe-area-inset-top,0px))}
  #obj{top:calc(110px + env(safe-area-inset-top,0px))}
}
@media (max-width:640px){
  .stat{padding:6px 8px;font-size:16px}.stat.opt{display:none}
  #obj{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));min-width:0}
  #toasts{bottom:calc(130px + env(safe-area-inset-bottom,0px))}
  #card{left:max(10px,env(safe-area-inset-left,0px));width:auto;bottom:calc(126px + env(safe-area-inset-bottom,0px))}
  .tool{width:50px}
  .mc h1{font-size:42px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<canvas id="cv" aria-label="Région en 3D"></canvas>
<div id="labels"></div>

<div id="hud">
  <div class="stat chip" title="Budget (solde du jour en petit)"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="#f5cf4f"/><circle cx="10" cy="10" r="6" fill="none" stroke="#b8901c" stroke-width="1.4"/><text x="10" y="13.6" text-anchor="middle" font-size="10" font-weight="800" fill="#8a6a10" font-family="Barlow,sans-serif">€</text></svg><span id="sMoney">0</span><small id="sDelta"></small></div>
  <div class="stat chip" title="Population"><svg width="20" height="20" viewBox="0 0 20 20" fill="#cfd7e8"><circle cx="7" cy="6" r="3"/><circle cx="14" cy="7.5" r="2.4"/><path d="M1.5 17c.4-4 2.6-6 5.5-6s5.1 2 5.5 6z"/><path d="M12.6 17c-.1-2-.7-3.6-1.7-4.7.9-.6 1.9-.9 3.1-.9 2.4 0 4.2 1.7 4.5 5.6z"/></svg><span id="sPop">0</span></div>
  <div class="stat chip" title="Satisfaction des habitants"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="currentColor" id="satIco"/><circle cx="7" cy="8" r="1.2" fill="#0f1624"/><circle cx="13" cy="8" r="1.2" fill="#0f1624"/><path id="satMouth" d="M6.5 12.2q3.5 3 7 0" stroke="#0f1624" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span id="sSat">0 %</span></div>
  <div class="stat chip" title="Jour et heure"><span id="sunIco"></span><span id="sTime">J1 06:00</span></div>
  <div class="stat chip opt" title="Météo"><span id="wIco"></span></div>
</div>

<div id="ctrl">
  <div class="grp chip" id="speeds">
    <button class="ib" data-speed="0" title="Pause (Espace)"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></button>
    <button class="ib" data-speed="1" title="Vitesse normale"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg></button>
    <button class="ib" data-speed="3" title="Rapide"><svg width="20" height="16" viewBox="0 0 20 16" fill="currentColor"><path d="M1 2l9 6-9 6zM10 2l9 6-9 6z"/></svg></button>
    <button class="ib" data-speed="8" title="Très rapide"><svg width="24" height="16" viewBox="0 0 24 16" fill="currentColor"><path d="M0 2l8 6-8 6zM8 2l8 6-8 6zM16 2l8 6-8 6z"/></svg></button>
  </div>
  <div class="grp chip">
    <button class="ib" id="bHeat" title="Bouchons (H)"><svg width="14" height="22" viewBox="0 0 14 22"><rect x="1" y="1" width="12" height="20" rx="4" fill="#2a3142"/><circle cx="7" cy="5.5" r="2.6" fill="#ee5a5a"/><circle cx="7" cy="11" r="2.6" fill="#f5cf4f"/><circle cx="7" cy="16.5" r="2.6" fill="#45c08a"/></svg></button>
    <button class="ib" id="bSound" title="Son"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path id="sndW" d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/></svg></button>
    <button class="ib" id="bSave" title="Sauvegarder"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 2.5h10l3 3v10h-13z"/><path d="M5.5 2.5v4h6v-4M5 15.5v-5h8v5"/></svg></button>
    <button class="ib" id="bNew" title="Nouvelle région"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9a6 6 0 1 1-2-4.5"/><path d="M14 1.5v3.5h-3.5"/></svg></button>
    <button class="ib" id="bHelp" title="Aide">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="7.5"/><path d="M6.8 7a2.3 2.3 0 1 1 3 2.2c-.6.3-.8.7-.8 1.4"/><circle cx="9" cy="13.3" r=".6" fill="currentColor"/></svg></button>
  </div>
</div>

<div id="obj" class="chip" title="Objectif en cours"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#f5cf4f" stroke-width="1.8"><circle cx="10" cy="10" r="8"/><circle cx="10" cy="10" r="4.5"/><circle cx="10" cy="10" r="1.3" fill="#f5cf4f"/></svg><span class="t" id="oText"></span><div class="bar"><i id="oBar"></i></div><span class="rw" id="oRw"></span></div>

<nav id="dock" class="chip" aria-label="Outils"></nav>
<div id="card" class="chip" hidden></div>
<div id="tip" class="chip" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div class="mc chip" id="mc"></div></div>

<script>
'use strict';
(() => {
if (!window.THREE){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:40% 0 auto;text-align:center;font:600 16px sans-serif">Impossible de charger le moteur 3D. Vérifiez la connexion Internet puis rechargez la page.</p>');return}
// ================================================================ Constantes
const W=72, H=46, N=W*H;
const MIN_PER_SEC=2, MAXV=900, DEMAND=1.6, SAVE_KEY='grandReseau3d.save.v1';
const ROAD=[null,
  {name:'Chemin',    speed:30, cap:4, cost:40, upkeep:1, w:.26, col:'#c8ae7c', lanes:[.05]},
  {name:'Route',     speed:50, cap:8, cost:120,upkeep:3, w:.34, col:'#6d7179', lanes:[.075], mark:'#f5cf4f'},
  {name:'Nationale', speed:80, cap:16,cost:320,upkeep:8, w:.48, col:'#585c64', lanes:[.17,.07], mark:'#ffffff', edge:'#dc4437'},
  {name:'Autoroute', speed:130,cap:30,cost:850,upkeep:20,w:.7,  col:'#41454d', lanes:[.25,.12], mark:'#ffffff', edge:'#2f6fd6'}];
const STREET={name:'Rue',speed:35,cap:8,w:.3,col:'#a7a9ad',lanes:[.06]};
const TERR=[{n:'Prairie',m:1},{n:'Forêt',m:1.4},{n:'Eau',m:5},{n:'Montagne',m:4},{n:'Plage',m:1.1}];
const WEATHER=[{n:'Dégagé',sp:1,acc:1},{n:'Pluie',sp:.85,acc:1.8},{n:'Brouillard',sp:.72,acc:2.2},{n:'Neige',sp:.6,acc:3}];
const TOLL_COST=2500, TELE_COST=3000, RADAR_COST=800, TOW_COST=500;
const CAR_COLORS=['#e5484d','#3e63dd','#f2f2f2','#2b2f36','#30a46c','#f76b15','#8e4ec6','#ffc53d','#7b8794','#12a594'];
const NAMES=['Valbrune','Montsoleil','Rochemaure','Bellerive','Clairval','Fontvert','Castelroc','Mirebelle','Vernois','Port-Aurel','Sainte-Lise','Hautemont','Lussigny','Brévannes','Sauveterre','Chantemerle','Roquebrune','Pierrefeu','Montargent','Saint-Clair','Bois-Joli','Les Granges','Aigueblanche','Vallon-d\'Or','Gramont','Lanvic'];
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

// ================================================================ Utilitaires
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const eur=n=>fmt(n)+' €';
const pct=n=>Math.round(n*100)+' %';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(i,k){let h=Math.imul(i*374761393+k*668265263|0,1274126177);h^=h>>>13;h=Math.imul(h,1103515245);return((h^h>>>16)>>>0)/4294967296}
function makeNoise(r){
  const p=new Float32Array(65536);for(let i=0;i<p.length;i++)p[i]=r();
  const g=(a,b)=>p[(a&255)+((b&255)<<8)];
  const val=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(g(xi,yi),g(xi+1,yi),u),lerp(g(xi,yi+1),g(xi+1,yi+1),u),v)};
  return (x,y)=>{let s=0,a=1,f=1,t=0;for(let o=0;o<4;o++){s+=val(x*f,y*f)*a;t+=a;a*=.5;f*=2}return s/t};
}
const tx=i=>i%W, ty=i=>(i/W)|0;
const wx=x=>x-W/2+.5, wz=y=>y-H/2+.5;
const satCol=s=>s<.4?'#ee5a5a':s<.6?'#f2a33a':'#45c08a';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ================================================================ État
let seed,terrain,deco,road,urban,worksT,worksLvl,worksDur,toll,tollTele,equipRev,radar,radarCover,accident,load,flow,comp,spd,capA,flash;
let cities=[],vehicles=[],worksList=[],accList=[],namePool=[],nameIdx=0;
let money=0,gameMin=0,stats,today,history=[],objectives=[],weather;
let paused=false,speed=1,lastSpeed=1,gameOver=false,heat=false,muted=false;
let netDirty=true,mapDirty=true,urbanDirty=true,rerouteBudget=0;
let tool='inspect',sel=-1,hover=-1,drag=null,preview=null;

function allocArrays(){
  terrain=new Uint8Array(N);deco=new Float32Array(N);road=new Uint8Array(N);urban=new Uint8Array(N);
  worksT=new Float32Array(N);worksLvl=new Uint8Array(N);worksDur=new Float32Array(N);
  toll=new Float32Array(N);tollTele=new Uint8Array(N);equipRev=new Float32Array(N);
  radar=new Uint8Array(N);radarCover=new Uint8Array(N);accident=new Float32Array(N);
  load=new Float32Array(N);flow=new Float32Array(N);comp=new Int32Array(N);
  spd=new Float32Array(N);capA=new Float32Array(N);flash=new Float32Array(N);
}
const freshToday=()=>({inc:{trips:0,toll:0,fines:0,tax:0,bonus:0,other:0},exp:{build:0,maint:0,other:0},trips:0,acc:0});
function earn(v,c){money+=v;today.inc[c]+=v}
function spend(v,c){money-=v;today.exp[c]+=v}
const drivable=i=>road[i]>0||urban[i]>0;
const sumObj=o=>Object.values(o).reduce((a,b)=>a+b,0);

// ================================================================ Génération
function newCity(x,y,pop,name,village){return {id:cities.length,name,x,y,pop,sat:.5,g:0,acc:0,tiles:[],dest:[],destW:0,comp:-1,village:!!village,tripsDay:0}}
function nextName(){return nameIdx<namePool.length?namePool[nameIdx++]:'Hameau '+(++nameIdx-namePool.length)}
function genMap(sd){
  allocArrays(); const r=mulberry32(sd), ne=makeNoise(r), nm=makeNoise(r);
  const e=new Float32Array(N);let mn=9,mx=-9;
  for(let i=0;i<N;i++){const v=ne(tx(i)*.075,ty(i)*.075);e[i]=v;if(v<mn)mn=v;if(v>mx)mx=v}
  for(let i=0;i<N;i++){const v=(e[i]-mn)/(mx-mn),m=nm(tx(i)*.1+40,ty(i)*.1+40);terrain[i]=v<.2?2:v>.8?3:m>.57?1:0;deco[i]=r()}
  let x=Math.floor(W*(.25+r()*.5));
  for(let y=0;y<H;y++){terrain[y*W+x]=2;if(r()<.3&&x+1<W)terrain[y*W+x+1]=2;if(r()<.4){const nx=clamp(x+(r()<.5?-1:1),2,W-3);terrain[y*W+nx]=2;x=nx}}
  for(let i=0;i<N;i++){if(terrain[i]!==0||deco[i]>.55)continue;for(const[dx,dy]of DIRS){const nx=tx(i)+dx,ny=ty(i)+dy;if(nx>=0&&ny>=0&&nx<W&&ny<H&&terrain[ny*W+nx]===2){terrain[i]=4;break}}}
  namePool=NAMES.slice();for(let i=namePool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[namePool[i],namePool[j]]=[namePool[j],namePool[i]]}
  nameIdx=0;cities=[];
  const sizes=[46000,23000,17000,9500,6500,4200,2600];let minD=12;
  for(let t=0;cities.length<sizes.length&&t<8000;t++){
    if(t===3000)minD=9;if(t===6000)minD=7;

      let sp=spd[n];if(sp<=0)continue;if(truck&&sp>90)sp=90;let c=gS[cur]+60/sp;if(toll[n]>0)c+=toll[n]*(truck?2.5:1)/vot;

// ================================================================ Simulation
function todFactor(h){return .22+1.7*Math.exp(-((h-8)**2)/2)+1.9*Math.exp(-((h-17.5)**2)/2.5)+.75*Math.exp(-((h-13)**2)/8)}

function updateSpeeds(){

    if(worksT[i]>0&&L){s=Math.min(s,25);c*=.5}

  const s=c.tiles.length?c.tiles[(Math.random()*c.tiles.length)|0]:c.y*W+c.x, g=d.tiles.length?d.tiles[(Math.random()*d.tiles.length)|0]:d.y*W+d.x;

function commitRoad(tiles,L){
  if(!unlocked(L))return;let cost=0;const todo=[];
  for(const i of tiles){const c=buildCost(i,L);if(c>0){cost+=c;todo.push(i)}}
  if(!todo.length)return;
  if(cost>money){toast('Fonds insuffisants','bad');sfx.err();return}
  spend(cost,'build');
  for(const i of todo){const cur=curLevel(i),was=worksT[i]>0;worksLvl[i]=L;const dur=(cur?35:50)*(terrain[i]===2||terrain[i]===3?2:1)*(.8+L*.2);
    worksT[i]=(was?worksT[i]:0)+dur;worksDur[i]=worksT[i];if(!was)worksList.push(i)}
  mapDirty=true;sfx.build();toast(`−${eur(cost)}`,'ok');
}
function commitBulldoze(tiles){
  let refund=0,n=0;
  for(const i of tiles){if(!(road[i]||worksT[i]>0||toll[i]||radar[i]))continue;if(road[i])refund+=ROAD[road[i]].cost*TERR[terrain[i]].m*.25;
    road[i]=0;worksT[i]=0;worksLvl[i]=0;toll[i]=0;tollTele[i]=0;radar[i]=0;equipRev[i]=0;n++;
    if(accident[i]>0&&!urban[i]){accident[i]=0;accList=accList.filter(a=>a!==i)}}
  if(!n)return;worksList=worksList.filter(i=>worksT[i]>0);earn(refund,'other');updateRadarCover();netDirty=mapDirty=true;sfx.build();toast(`+${eur(refund)}`,'ok');
}
function placeEquip(i,kind){
  if(kind==='toll'&&toll[i]>0||kind==='radar'&&radar[i]){select(i);return}
  if(!road[i]||urban[i]){toast('Sur une route, hors ville','bad');sfx.err();return}
  if(toll[i]>0||radar[i]){toast('Déjà équipé','bad');sfx.err();return}
  const cost=kind==='toll'?TOLL_COST:RADAR_COST;if(money<cost){toast('Fonds insuffisants','bad');sfx.err();return}
  spend(cost,'build');if(kind==='toll')toll[i]=2;else{radar[i]=1;updateRadarCover()}
  equipRev[i]=0;mapDirty=true;sfx.build();select(i);
}

let actx=null;
function initAudio(){if(actx)return;try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null}}
function beep(f,d,type='sine',vol=.05){if(!actx||muted)return;try{const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={build(){beep(520,.07,'square',.025);setTimeout(()=>beep(390,.06,'square',.02),50)},coin(){beep(880,.08);setTimeout(()=>beep(1320,.14),70)},crash(){beep(150,.35,'sawtooth',.035)},err(){beep(190,.12,'square',.025)}};

// Sauvegarde
function hasSave(){try{return!!localStorage.getItem(SAVE_KEY)}catch(e){return false}}
function save(auto){
  const sparse=[];for(let i=0;i<N;i++)if(toll[i]>0||radar[i])sparse.push([i,toll[i],tollTele[i],radar[i],Math.round(equipRev[i])]);
  const data={v:1,seed,money,gameMin,road:Array.from(road),sparse,works:worksList.map(i=>[i,worksLvl[i],worksT[i],worksDur[i]]),
    cities:cities.map(c=>({name:c.name,x:c.x,y:c.y,pop:c.pop,sat:c.sat,g:c.g,village:c.village})),stats,today,history,objectives,weather,nameIdx,muted,cam:{...cam}};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));if(!auto)toast('Sauvegardé','ok')}catch(e){if(!auto)toast('Sauvegarde impossible','bad')}
}
function load_(){
  let d;try{d=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){d=null}
  if(!d||d.v!==1)return false;
  try{seed=d.seed;genMap(seed);road.set(d.road);
    for(const[i,p,t,r,rev]of d.sparse){toll[i]=p;tollTele[i]=t;radar[i]=r;equipRev[i]=rev}
    worksList=[];for(const[i,l,t,du]of d.works){worksLvl[i]=l;worksT[i]=t;worksDur[i]=du;worksList.push(i)}
    cities=[];for(const c of d.cities){const n=newCity(c.x,c.y,c.pop,c.name,c.village);n.sat=c.sat;n.g=c.g||0;cities.push(n)}
    money=d.money;gameMin=d.gameMin;stats=d.stats;today=d.today||freshToday();history=d.history||[];objectives=d.objectives;weather=d.weather||{t:0,until:gameMin+300};nameIdx=d.nameIdx||0;muted=!!d.muted;
    afterWorldChange();if(d.cam)Object.assign(cam,d.cam);clampCam();return true}
  catch(e){console.error(e);toast('Sauvegarde abîmée','bad');return false}
}
function afterWorldChange(){
  vehicles=[];accList=[];accident.fill(0);load.fill(0);flow.fill(0);gameOver=false;paused=false;sel=-1;lastSig='';drag=null;preview=null;
  computeUrban();updateRadarCover();computeComps();updateSpeeds();buildStatic();buildDynamic();updateWeatherFx();
  fitCam();buildDock();setTool('inspect');renderCard();updateHud();
}
function newGame(){
  seed=(Math.random()*2**31)|0;genMap(seed);
  money=30000;gameMin=7*60;stats={totalTrips:0,failed:0,tollTotal:0,finesTotal:0,accTotal:0,cancelled:0};today=freshToday();history=[];weather={t:0,until:gameMin+360};worksList=[];
  computeUrban();
  let best=null,bd=1e9;for(const a of cities)for(const b of cities)if(a.id<b.id){const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best=[a,b]}}
  if(best){const p=planPath(best[0].y*W+best[0].x,best[1].y*W+best[1].x,1);if(p)for(const i of p)if(!urban[i])road[i]=1}
  objectives=makeObjectives();afterWorldChange();speed=1;lastSpeed=1;
}

// ================================================================ Entrées
const tipEl=$('#tip');
function updatePreview(straight){
  if(!drag||(drag.type!=='road'&&drag.type!=='bull'))return;
  const tiles=drag.type==='bull'||straight?lPath(drag.start,drag.end):planPath(drag.start,drag.end,drag.lvl)||lPath(drag.start,drag.end);
  if(drag.type==='bull'){let ref=0;for(const i of tiles)if(road[i])ref+=ROAD[road[i]].cost*TERR[terrain[i]].m*.25;preview={kind:'bull',tiles};tipEl.innerHTML=`${IC.trash}<span class="pos">+${eur(ref)}</span>`}
  else{let cost=0;for(const i of tiles)cost+=buildCost(i,drag.lvl);const ok=cost<=money;preview={kind:'road',tiles,lvl:drag.lvl,ok};tipEl.innerHTML=`${roadIcon(drag.lvl)}<span class="${ok?'':'neg'}">${eur(cost)}</span>`}
  tipEl.hidden=false;
}
function placeTip(e){tipEl.style.left=Math.min(e.clientX+18,innerWidth-tipEl.offsetWidth-8)+'px';tipEl.style.top=Math.min(e.clientY+20,innerHeight-44)+'px'}
const pointers=new Map();let pinch=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  initAudio();if(gameOver)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){drag=null;preview=null;tipEl.hidden=true;const[a,b]=[...pointers.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,dist:cam.dist,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,ang:Math.atan2(b.y-a.y,b.x-a.x),yaw:cam.yaw};return}
  if(e.button===1||(e.button===2&&e.altKey)){drag={type:'rot',sx:e.clientX,sy:e.clientY,yaw:cam.yaw,pitch:cam.pitch};e.preventDefault();return}
  if(e.button===2||tool==='pan'){drag={type:'pan',lx:e.clientX,ly:e.clientY};cv.style.cursor='grabbing';return}
  if(e.button!==0)return;
  const t=tileAt(e.clientX,e.clientY);if(t<0)return;const L=toolLevel(tool);
  if(L){drag={type:'road',start:t,end:t,lvl:L};updatePreview(e.shiftKey);placeTip(e)}
  else if(tool==='bull'){drag={type:'bull',start:t,end:t};updatePreview(true);placeTip(e)}
  else if(tool==='toll')placeEquip(t,'toll');else if(tool==='radar')placeEquip(t,'radar');else select(t);
});
cv.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size>=2){const[a,b]=[...pointers.values()],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;cam.dist=pinch.dist*pinch.d/(Math.hypot(a.x-b.x,a.y-b.y)||1);
    cam.yaw=pinch.yaw-(Math.atan2(b.y-a.y,b.x-a.x)-pinch.ang);panBy(cx-pinch.cx,cy-pinch.cy);pinch.cx=cx;pinch.cy=cy;clampCam();return}
  hover=tileAt(e.clientX,e.clientY);if(!drag)return;
  if(drag.type==='pan'){panBy(e.clientX-drag.lx,e.clientY-drag.ly);drag.lx=e.clientX;drag.ly=e.clientY;return}
  if(drag.type==='rot'){cam.yaw=drag.yaw-(e.clientX-drag.sx)*.006;cam.pitch=drag.pitch+(e.clientY-drag.sy)*.004;clampCam();return}
  if(hover>=0&&(hover!==drag.end||drag.shift!==e.shiftKey)){drag.end=hover;drag.shift=e.shiftKey;updatePreview(drag.type==='bull'||e.shiftKey)}placeTip(e);
});
function endPointer(e,commit){pointers.delete(e.pointerId);if(pinch){if(pointers.size<2)pinch=null;return}if(!drag)return;const d=drag;drag=null;tipEl.hidden=true;
  if(d.type==='pan'||d.type==='rot'){cv.style.cursor=tool==='pan'?'grab':tool==='inspect'?'default':'crosshair';return}
  if(commit&&preview){if(d.type==='road')commitRoad(preview.tiles,d.lvl);else commitBulldoze(preview.tiles)}preview=null}
cv.addEventListener('pointerup',e=>endPointer(e,true));cv.addEventListener('pointercancel',e=>endPointer(e,false));cv.addEventListener('pointerleave',()=>{hover=-1});
// Le zoom vise le point du sol sous le curseur
const zA=new THREE.Vector3(),zB=new THREE.Vector3();
function groundAt(mx,my,out){placeCamera();ndc.set(mx/innerWidth*2-1,-(my/innerHeight)*2+1);ray.setFromCamera(ndc,camera);return ray.ray.intersectPlane(groundPlane,out)}
cv.addEventListener('wheel',e=>{e.preventDefault();const ok=groundAt(e.clientX,e.clientY,zA);cam.dist*=Math.exp(e.deltaY*.0012);clampCam();
  if(ok&&groundAt(e.clientX,e.clientY,zB)){cam.tx+=zA.x-zB.x;cam.tz+=zA.z-zB.z;clampCam()}},{passive:false});
const keys=new Set();const PAN_CODES=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE'];
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(!$('#modal').hidden){if(e.key==='Escape'&&!gameOver){const b=$('#mOk')||$('#mCont');if(b)b.click()}return}
  // Déplacement par position physique (ZQSD en AZERTY = WASD en QWERTY), rotation sur A/E (AZERTY) = Q/E (QWERTY)
  if(PAN_CODES.includes(e.code)){keys.add(e.code);if(e.code.startsWith('Arrow'))e.preventDefault();return}
  if(e.code==='Space'){e.preventDefault();setSpeed(paused?lastSpeed:0);return}
  if(e.key==='Escape'){if(drag&&drag.type!=='pan'){drag=null;preview=null;tipEl.hidden=true}else{setTool('inspect');select(-1)}return}
  if(e.repeat)return;const k=e.key.toLowerCase();
  const digit={Digit1:'r1',Digit2:'r2',Digit3:'r3',Digit4:'r4',Numpad1:'r1',Numpad2:'r2',Numpad3:'r3',Numpad4:'r4'}[e.code];
  const map={t:'toll',r:'radar',b:'bull',m:'pan',i:'inspect'};
  if(digit)setTool(digit);else if(map[k])setTool(map[k]);else if(k==='h'){heat=!heat;updateHud()}
  else if(e.key==='+'||e.key==='='){cam.dist*=.8;clampCam()}else if(e.key==='-'){cam.dist*=1.25;clampCam()}
});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
function panKeys(rdt){let dx=0,dy=0;if(keys.has('ArrowLeft')||keys.has('KeyA'))dx++;if(keys.has('ArrowRight')||keys.has('KeyD'))dx--;if(keys.has('ArrowUp')||keys.has('KeyW'))dy++;if(keys.has('ArrowDown')||keys.has('KeyS'))dy--;
  if(dx||dy)panBy(dx*500*rdt,dy*500*rdt);if(keys.has('KeyQ'))cam.yaw+=1.6*rdt;if(keys.has('KeyE'))cam.yaw-=1.6*rdt}
document.querySelectorAll('#speeds .ib').forEach(b=>b.onclick=()=>{initAudio();setSpeed(+b.dataset.speed)});
$('#bHeat').onclick=()=>{heat=!heat;updateHud()};$('#bSound').onclick=()=>{initAudio();muted=!muted;updateHud()};$('#bSave').onclick=()=>save(false);$('#bHelp').onclick=helpModal;
$('#bNew').onclick=()=>{const wp=paused;paused=true;updateHud();onModalClose=()=>{paused=wp;updateHud()};
  modal(`<h1 style="font-size:40px">Nouvelle région ?</h1><p class="sub">La partie actuelle sera remplacée.</p><div class="mbtn"><button class="ab y" id="mYes">Oui</button><button class="ab" id="mSaveNew">Sauver puis oui</button><button class="ab" id="mOk">Annuler</button></div>`,
  {mYes:()=>{onModalClose=null;closeModal();newGame()},mSaveNew:()=>{save(false);onModalClose=null;closeModal();newGame()},mOk:closeModal})};
$('#obj').onclick=()=>{const o=objectives.find(o=>!o.done);if(o&&o.k==='link'){const c=cities[o.a];if(c)centerOn(c.y*W+c.x)}};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);

// ================================================================ Boucle
let last=performance.now(),lastUi=0,lastBuild=0;
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;
  if(!paused&&!gameOver){let g=rdt*MIN_PER_SEC*speed;while(g>1e-6){const s=Math.min(.25,g);simStep(s);g-=s;if(gameOver)break}}
  panKeys(rdt);
  if(mapDirty&&now-lastBuild>150){lastBuild=now;buildDynamic()}
  render(rdt,now);
  if(now-lastUi>250){lastUi=now;checkObjectives();updateHud();renderCard()}
  requestAnimationFrame(frame);
}
resize();newGame();paused=true;updateHud();
onModalClose=()=>{if(!gameOver){paused=false;updateHud()}};
introModal();
requestAnimationFrame(frame);
})();
</script>
