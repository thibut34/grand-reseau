<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grand Réseau — Ville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="cv" aria-label="Ville en 3D"></canvas>
<div id="boot">Chargement de la ville…</div>

<div id="hud">
  <div class="stat chip" title="Budget · recettes par heure"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="#f5cf4f"/><circle cx="10" cy="10" r="6" fill="none" stroke="#b8901c" stroke-width="1.4"/><text x="10" y="13.6" text-anchor="middle" font-size="10" font-weight="800" fill="#8a6a10" font-family="Barlow,sans-serif">€</text></svg><span id="sMoney">0</span><small id="sInc" class="pos"></small></div>
  <div class="stat chip" title="Habitants"><svg width="20" height="20" viewBox="0 0 20 20" fill="#cfd7e8"><circle cx="7" cy="6" r="3"/><circle cx="14" cy="7.5" r="2.4"/><path d="M1.5 17c.4-4 2.6-6 5.5-6s5.1 2 5.5 6z"/><path d="M12.6 17c-.1-2-.7-3.6-1.7-4.7.9-.6 1.9-.9 3.1-.9 2.4 0 4.2 1.7 4.5 5.6z"/></svg><span id="sPop">0</span></div>
  <div class="stat chip" title="Satisfaction (durée des trajets)"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" id="satIco" fill="#45c08a"/><circle cx="7" cy="8" r="1.2" fill="#0f1624"/><circle cx="13" cy="8" r="1.2" fill="#0f1624"/><path id="satMouth" d="M6.5 12.2q3.5 3 7 0" stroke="#0f1624" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span id="sSat">0 %</span></div>
  <div class="stat chip" title="Fluidité du trafic · voitures en circulation"><svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="#cfd7e8" stroke-width="1.7" stroke-linecap="round"><path d="M2.5 13a6.5 6.5 0 1 1 13 0"/><path d="M9 13l3.5-4"/></svg><span id="sFlu">100 %</span><small id="sCars" style="color:var(--muted)"></small></div>
  <div class="stat chip" title="Jour et heure"><span id="sunIco"></span><span id="sTime">J1 06:30</span><span id="wIco"></span></div>
</div>

<div id="ctrl">
  <div class="grp chip" id="speeds">
    <button class="ib" data-speed="0" title="Pause (Espace)"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></button>
    <button class="ib" data-speed="1" title="Vitesse normale"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg></button>
    <button class="ib" data-speed="2" title="Rapide"><svg width="20" height="16" viewBox="0 0 20 16" fill="currentColor"><path d="M1 2l9 6-9 6zM10 2l9 6-9 6z"/></svg></button>
    <button class="ib" data-speed="4" title="Très rapide"><svg width="24" height="16" viewBox="0 0 24 16" fill="currentColor"><path d="M0 2l8 6-8 6zM8 2l8 6-8 6zM16 2l8 6-8 6z"/></svg></button>
  </div>
  <div class="grp chip">
    <button class="ib" id="bHeat" title="Bouchons (H)"><svg width="14" height="22" viewBox="0 0 14 22"><rect x="1" y="1" width="12" height="20" rx="4" fill="#2a3142"/><circle cx="7" cy="5.5" r="2.6" fill="#ee5a5a"/><circle cx="7" cy="11" r="2.6" fill="#f5cf4f"/><circle cx="7" cy="16.5" r="2.6" fill="#45c08a"/></svg></button>
    <button class="ib" id="bHQ" title="Graphismes haute qualité"><b style="position:static;font-size:13px">HD</b></button>
    <button class="ib" id="bSound" title="Son"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path id="sndW" d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/></svg></button>
    <button class="ib" id="bSave" title="Sauvegarder"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 2.5h10l3 3v10h-13z"/><path d="M5.5 2.5v4h6v-4M5 15.5v-5h8v5"/></svg></button>
    <button class="ib" id="bNew" title="Nouvelle ville"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9a6 6 0 1 1-2-4.5"/><path d="M14 1.5v3.5h-3.5"/></svg></button>
    <button class="ib" id="bHelp" title="Aide"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="7.5"/><path d="M6.8 7a2.3 2.3 0 1 1 3 2.2c-.6.3-.8.7-.8 1.4"/><circle cx="9" cy="13.3" r=".6" fill="currentColor"/></svg></button>
  </div>
</div>

<div id="obj" class="chip" title="Objectif en cours"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#f5cf4f" stroke-width="1.8"><circle cx="10" cy="10" r="8"/><circle cx="10" cy="10" r="4.5"/><circle cx="10" cy="10" r="1.3" fill="#f5cf4f"/></svg><span class="t" id="oText"></span><div class="bar"><i id="oBar"></i></div><span class="rw" id="oRw"></span></div>
<nav id="dock" class="chip" aria-label="Outils"></nav>
<div id="card" class="chip" hidden></div>
<div id="tip" class="chip" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div class="mc chip" id="mc"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
